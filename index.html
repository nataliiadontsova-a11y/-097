<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phone Scan Creative</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#eef1f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#ffffff 0%,#dfe5f0 70%)}
.stage{width:420px;height:860px;position:relative;flex:none;transform-origin:center center}
.phone{position:absolute;inset:0;border-radius:62px;background:#15171c;box-shadow:0 40px 80px rgba(20,30,60,.35),inset 0 0 0 2px #3a3d45,inset 0 0 0 6px #0b0c0f}
.btn-side{position:absolute;background:#2a2d34;border-radius:3px;width:4px}
.screen{position:absolute;left:14px;top:14px;width:392px;height:832px;border-radius:48px;overflow:hidden;background:linear-gradient(180deg,#f7f9fc 0%,#eef2f8 100%)}
.island{position:absolute;left:50%;top:12px;width:112px;height:32px;margin-left:-56px;background:#000;border-radius:20px;z-index:20}
.content{position:absolute;inset:0;transition:opacity .4s}
.content.fade{opacity:0}

/* gender */
.g{position:absolute;top:70px;width:160px;height:112px;border-radius:22px;background:#fff;border:2px solid #e2e7f0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:all .25s;box-shadow:0 4px 14px rgba(30,50,90,.06)}
.g .ic{font-size:62px;font-weight:700;line-height:1;color:#9aa4b6;transition:color .25s}
.g .lb{font-size:16px;font-weight:600;color:#6b7487;transition:color .25s}
.g.f{left:24px}.g.m{left:208px}
.g.on{border-color:#ff4f8b;background:#fff0f5;transform:scale(1.04);box-shadow:0 8px 22px rgba(255,79,139,.25)}
.g.on .ic,.g.on .lb{color:#ff4f8b}

/* fields */
.lab{position:absolute;left:30px;font-size:13px;font-weight:600;color:#8a93a6;letter-spacing:.3px}
.inp{position:absolute;left:24px;width:344px;height:52px;border-radius:16px;background:#fff;border:2px solid #e2e7f0;padding:0 18px;display:flex;align-items:center;font-size:20px;font-weight:600;color:#1d2433;transition:border-color .2s,box-shadow .2s}
.inp.focus{border-color:#4f7cff;box-shadow:0 0 0 4px rgba(79,124,255,.15)}
.caret{display:none;width:2px;height:24px;background:#4f7cff;margin-left:2px;animation:blink .8s steps(1) infinite}
.inp.focus .caret{display:block}
@keyframes blink{50%{opacity:0}}

/* loading space */
.box{position:absolute;left:24px;top:402px;width:344px;height:178px;border-radius:22px;border:2px dashed #cdd5e3;background:rgba(255,255,255,.6);overflow:hidden}
.load{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;opacity:0;transition:opacity .25s}
.load.show{opacity:1}
.spin{width:46px;height:46px;border-radius:50%;border:5px solid #dde4f2;border-top-color:#4f7cff;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.bar{width:260px;height:10px;border-radius:6px;background:#e3e8f2;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,#4f7cff,#2ee6d6)}
.res{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:18px}
.tile{position:relative;width:94px;height:94px;border-radius:16px;background:#fff;box-shadow:0 6px 16px rgba(30,50,90,.12);opacity:0;transform:scale(.4)}
.tile.show{animation:pop .4s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes pop{to{opacity:1;transform:scale(1)}}
.tile img{width:100%;height:100%;object-fit:cover;border-radius:16px;display:block}
.tile svg{position:absolute;left:-4px;top:-4px;width:102px;height:102px;overflow:visible}
.tile line{stroke:#ff1f2d;stroke-width:12;stroke-linecap:round;stroke-dasharray:150;stroke-dashoffset:150;filter:drop-shadow(0 2px 3px rgba(150,0,0,.35))}
.tile.x line{animation:draw .22s ease-out forwards}
.tile.x line+line{animation-delay:.14s}
@keyframes draw{to{stroke-dashoffset:0}}

/* fingerprint */
.fpw{position:absolute;left:50%;top:612px;width:150px;height:170px;margin-left:-75px;border-radius:32px;display:flex;align-items:center;justify-content:center;transition:background .3s,box-shadow .3s}

      <div class="fpw" id="fpw"><div class="fp"></div><div class="scan"></div></div>
    </div>
    <div class="touch" id="touch"></div>
    <div class="home"></div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
const stage=$('stage');
function fit(){const s=Math.min(innerWidth/460,innerHeight/900);stage.style.transform='scale('+s+')'}
addEventListener('resize',fit);fit();

const touch=$('touch');
const move=(x,y)=>touch.style.transform=`translate(${x}px,${y}px)`;
const tap=()=>{touch.classList.remove('tap');void touch.offsetWidth;touch.classList.add('tap')};
const LOOP=10000;
let t0;
const at=t=>new Promise(r=>setTimeout(r,Math.max(0,t0+t-performance.now())));
let barRAF;

function reset(){
  ['gf','gm'].forEach(i=>$(i).classList.remove('on'));
  ['name','age'].forEach(i=>$(i).classList.remove('focus'));
  $('nameT').textContent='';$('ageT').textContent='';
  $('load').classList.remove('show');$('bar').style.width='0';
  for(let i=0;i<3;i++)$('t'+i).className='tile';
  $('fpw').className='fpw';
  $('content').classList.remove('fade');
  touch.style.transition='none';move(196,780);touch.style.opacity=0;
  void touch.offsetWidth;touch.style.transition='';
}
async function type(el,str,start,step){
  for(let i=0;i<str.length;i++){await at(start+i*step);el.textContent+=str[i]}
}
async function run(){
  t0=performance.now();reset();
  await at(150); touch.style.opacity=1;
  await at(350); move(104,126);
  await at(900); tap(); $('gf').classList.add('on');
  await at(1150); move(196,254);
  await at(1600); tap(); $('name').classList.add('focus');
  await type($('nameT'),'Hanna',1750,120);
  await at(2400); move(196,348);
  await at(2850); tap(); $('name').classList.remove('focus'); $('age').classList.add('focus');
  await type($('ageT'),'32',3000,160);
  await at(3350); move(196,697);
  await at(3850); tap(); $('age').classList.remove('focus'); $('fpw').classList.add('on');
  $('load').classList.add('show');
  const ls=performance.now(),LD=2700;
  cancelAnimationFrame(barRAF);
  (function step(){const p=Math.min(1,(performance.now()-ls)/LD);$('bar').style.width=(p*100)+'%';if(p<1)barRAF=requestAnimationFrame(step)})();
  await at(4150); touch.style.opacity=0;
  await at(6650); $('load').classList.remove('show'); $('fpw').classList.add('done');
  for(let i=0;i<3;i++){await at(6750+i*220);$('t'+i).classList.add('show')}
  for(let i=0;i<3;i++){await at(7500+i*280);$('t'+i).classList.add('x')}
  await at(9550); $('content').classList.add('fade');
  await at(LOOP); run();
}
run();
</script>
